<!doctype html>
<html lang="{{ site.lang | default: 'en-US' }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  {% seo %}
  <link rel="stylesheet" href="{{ '/assets/css/blog.css?v=' | append: site.github.build_revision | relative_url }}">
</head>
<body>
  <header class="site-header">
    <a class="home" href="{{ '/' | relative_url }}">Zhengping Jiang</a>
    <nav aria-label="Site">
      <a href="{{ '/' | relative_url }}">Research</a>
    </nav>
  </header>
  <main class="column">
    {% if page.layout == 'post' %}
    <article>
      <p class="meta"><time datetime="{{ page.date | date_to_xmlschema }}">{{ page.date | date: '%B %-d, %Y' }}</time> · {{ page.author | default: site.author | default: 'Zhengping Jiang' }}</p>
      <h1>{{ page.title | escape }}</h1>
      <div class="post-body">
      {{ content }}
      </div>
      <footer class="post-footer"><a href="{{ '/' | relative_url }}">← Back to Zhengping Jiang's homepage</a></footer>
    </article>
    {% else %}
    {{ content }}
    {% endif %}
  </main>
</body>
</html>
